name: Deploy static studio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require Actions as the Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          if [ "$source" != "workflow" ]; then
            echo "::error::Set Settings > Pages > Build and deployment > Source to GitHub Actions. Branch publishing can replace the editor with the repository README."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install the deployed-site test browser
        run: npx playwright install --with-deps chromium
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published editor
        env:
          SPRITECANVAS_SITE_URL: ${{ steps.deployment.outputs.page_url }}
          SPRITECANVAS_EXPECTED_SHA: ${{ github.sha }}
        run: npm run test:pages
      - name: Keep failed live-site evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-evidence
          path: test-results/pages
          if-no-files-found: ignore
